# Apply LAST after base/embedding configs. One observation call, no review.
# Only externally labelled, explicitly aligned source facts are admitted.
tools:
  visual_memory:
    enabled: true
    usage_mode: inject
    mode: image_text
    match_mode: fact
    allow_source_grounded: true
    allow_model_reviewed: false
    database_path: output/visual_memory/supervised_index_v3
    top_k: 2
    # Candidate-ranking threshold, not a calibrated correctness probability.
    min_similarity: 0.0
    reference_frames: 16
    query_frames: 16
    reference_short_side: 256
    max_calls_per_question: 4
    fail_open: true
    task_fact_types: {}
  memory_search:
    enabled: false
  clip_skim:
    refinement:
      high_resolution: false
      temporal_fill: false
