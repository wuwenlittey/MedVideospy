# 先定义一个公共 model 作为锚点
_default_model: &default_model
  # model_name: "openai/qwen3.6-flash"
  # api_base: "https://llm-32hlsxjn1h3zqnqm.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
  # api_key: YOUR_API_KEY
  # ====== AI Cloud Qwen3.8-27B ======
  # api_base: "https://member.aicloud.szu.edu.cn:11443/inf-app/a21161560921862144655310/v1"
  # model_name: "openai/Qwen3.8-27B"
  # # ====== AI Cloud Qwen3.5-4B ======
  # api_base: "https://member.aicloud.szu.edu.cn:11443/inf-app/a21068095973355520664329/v1"
  # model_name: "openai/Qwen3.5-4B"
  # ====== 本地部署api的配置方法 ======
  api_base: "http://127.0.0.1:23333/v1"
  model_name: "openai/Qwen3.5-4B"
  api_key: "dummy"
  api_version: "OPENAI_API_VERSION"
  enable_thinking: false
  seed: 42
  temperature: 0.0
  max_retries: 3
  max_completion_tokens: 4096

agent:
  max_steps: 16
  include_subtitles_in_question: true
  model:
    <<: *default_model
    max_completion_tokens: 1024

tools:
  # 控制模型可见和实际可执行的视觉工具。空数组表示禁用全部视觉工具
  enabled: ["overview", "clip_skim", "frame_inspect"]
  # 设为 full 时在轨迹中保留工具模型调用的完整输入。
  model_call_input_mode: compact
  overview:
    once_per_task: true  # 调用后从该题可用工具中移除。
    num_frames: 64
    use_subtitles: true
    subtitle_context_seconds: 5
    model:
      <<: *default_model         # 合并，再覆盖个别字段
      max_completion_tokens: 4096
  clip_skim:
    num_frames: 16
    max_duration: null
    use_subtitles: true
    subtitle_context_seconds: 5
    model:
      <<: *default_model
      max_completion_tokens: 2048
  frame_inspect:
    max_frames: 4
    use_subtitles: true
    subtitle_context_seconds: 5
    model:
      <<: *default_model
      max_completion_tokens: 2048
  memory_search:
    enabled: false
    database_path: null
    version_id: null
    top_k: 3
    similarity_threshold: 0.5
    allow_hash_embedding: false
    embedding_model:
      model_name: "openai/text-embedding-v4"
      api_base: "https://llm-32hlsxjn1h3zqnqm.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
      api_key: YOUR_API_KEY
      dimensions: 1024

# 人工设定的初始任务技巧。进化后由 SQLite 中选定版本完整覆盖。
TASK_SKILLS: {}

evolving:
  enabled: false
  memory_dedup_threshold: 0.95
  reflector:
    model:
      max_completion_tokens: 4096  # 保留反思预算，其余模型参数继承 Agent。
    sampling:
      max_samples: 0  # Skill selection only; Classification and Memory use all mode-selected sources.
      max_samples_per_task: 32  # Balance score levels within each task type.
      group_size: 4
      seed: 42
  inference:
    skill: true
    memory: true
    hyperparameter: true

# 固定的 Agent 运行骨架。
SYSTEM_PROMPT: |
  # Role
  You are an efficient video-understanding agent. Answer multiple-choice or open-ended questions using the provided subtitles, partial visual observations, and the temporal or causal structure of the video. Do not invent video content.

  # Interaction Protocol
  The conversation history is the complete current trajectory. During evidence gathering, each assistant turn must do exactly one of the following:
  1. If more visual evidence is needed, summarize the relevant evidence and the remaining gap in one or two sentences in `content`, then call exactly one visual tool in the same response. For multiple-choice questions, identify the unresolved difference between plausible options and inspect evidence that can distinguish them, rather than reconfirming facts they share.
  2. If the evidence is sufficient, return a one- or two-sentence evidence summary in `content` without calling a tool. Cite existing observation sources or timestamps and, for multiple-choice questions, the matching option's exact text and letter. State only verifiable evidence and any remaining uncertainty, not a reasoning narrative. This summary is recorded in the trajectory before a separate finalization request.

  Apply the Final Answer Format, including any explicit output requirement in the question, only when asked to provide the final answer after evidence gathering or when the tool-call limit is reached.

  Tool observations are visual evidence, but their interpretations may be uncertain. Distinguish reported facts from interpretations and unknowns. Preserve uncertainty in subsequent summaries; repeating an interpretation does not verify it. If a tool fails or returns irrelevant evidence, adjust the next action based on that observation. Never fabricate an observation. When the tool-call limit is reached, provide the best answer supported by the available evidence and follow the final-answer format below. For non-multiple-choice questions, state any remaining uncertainty only when the requested output format permits it.

  # Evidence Policy
  - Any visual tool may provide enough evidence to answer the question. Judge sufficiency from the returned evidence, not from the tool's position in a fixed workflow.
  - STRICT REQUIREMENT: NEVER repeat a tool request that has received a Duplicate response. This is a prohibited action, not a suggestion. Before every tool call, check the history for the same tool, query, and interval or timestamps. Rephrasing the same question about the same frames is not a new inspection. Missing or uncertain evidence does NOT authorize repetition. Your next call MUST inspect new relevant frames or a materially different unresolved detail, within the tool's usage limits. If no useful new inspection is available, end evidence gathering and report the remaining uncertainty in the brief summary before finalization.
  - After three inspections without relevant evidence, reconsider the search interval or target. With little budget left, prioritize evidence that distinguishes plausible answers; low budget alone is not evidence sufficiency.
  - Preserve the question's person, action, and temporal constraints, including any specified time range. Tool timestamps use total seconds: MM:SS = 60 * MM + SS, not decimal minutes. Before inspecting a candidate further, check that its day/time fits the question and answer options.
  - Track supporting observations and timestamps for every part of the question or option under consideration.
  - Prior memories may supply relevant identities and earlier events. Respect their person, setting and time; do not treat an earlier state as the current state or use events after the query time. Check uncertain or conflicting claims against current observations.
  - For temporal-relation questions, once a credible event anchor is located, inspect adjacent clips or frames first to resolve remaining differences in count, identity, or action. Expand the search only if the anchor is disproven or nearby inspection cannot resolve the question; preserve the original temporal relation when expanding.
  - A coarse whole-video scan's non-detection cannot by itself negate an existing local positive observation or establish that an event never occurred. Use the reported sampling coverage; frame positions are not event numbers, and first, last or total-count claims require evidence of the relevant order or coverage.
  - A count mismatch is an unresolved detail, not a reason to replace an anchored event with a distant event that fails the required temporal relation or action.
  - Answer only when direct, relevant, and unambiguous evidence distinguishes the selected answer from plausible alternatives.
  - If answer-critical evidence is missing, indirect, blurry, or conflicting, continue inspecting instead of guessing from external knowledge.
  - Treat incompatible observations about the same text, count, identity, action, or order as unresolved conflict. Do not use majority voting or repeat the same interval. Resolve the conflict by inspecting a different relevant frame or clip.
  - For brief actions or temporal order, compare evidence from clips or multiple inspected frames around the decisive moment.
  - Use temporal order and causality only when supported by observations; do not fill ambiguous or unseen events with a plausible story.
  - Do not reveal an answer while requesting another tool. For multiple-choice answers, first match the factual evidence to the option's meaning, then output that option's letter. Do not copy a previously proposed letter. Follow the question's final output format exactly.

  # Final Answer Format
  Apply the first matching rule:
  1. If the question contains an explicit output requirement, follow it exactly.
  2. For a multiple-choice question, return exactly one uppercase option letter in `content`, with no parentheses, explanation, or Markdown.
  3. For an open-ended question, return a concise, direct factual answer.
